<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FETHİYESPOR U19</title>
<meta name="theme-color" content="#0B1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FETHİYESPOR U19">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1218; --surface:#121E27; --ink:#E8F0F4; --muted:#8DA1AD; --line:#243642;
  --accent:#35E0A1; --accent-ink:#06130D; --good:#35E0A1; --bad:#FF5C73; --warn:#F2B84B; --low:#6EA8FF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:#E8EDEF;--surface:#F7F9FA;--ink:#12212B;--muted:#5B6B75;--line:#C9D3D8;--accent:#0E7A55;--accent-ink:#fff;--good:#17794F;--bad:#C62F47;--warn:#9A6200;--low:#2A5FC4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45}
.num,h1,h2{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
#app{max-width:640px;margin:0 auto;padding:20px 18px 110px}
h1{font-size:40px;line-height:1;margin:6px 0 4px;font-weight:800;letter-spacing:.01em}
h2{font-size:24px;margin:0;font-weight:700}
.sub{color:var(--muted);margin:0 0 18px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-weight:600;min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.small{padding:6px 12px;min-height:36px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list{border-top:1.5px solid var(--ink);margin-top:14px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;color:inherit}
.item b{font-weight:600;font-size:17px}
.item span{color:var(--muted);font-size:14px}
.empty{padding:28px 0;color:var(--muted)}
.empty p{margin:0 0 16px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
.form{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px 16px 16px;margin:14px 0}
.grp{border-top:1.5px solid var(--ink);margin-top:26px;padding-top:8px}
.m{display:grid;grid-template-columns:1fr auto 74px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.m .l{color:var(--muted);font-size:15px}
.m .v{text-align:right}
.m .v .num{font-size:30px;font-weight:800;line-height:1}
.m .v small{color:var(--muted);margin-left:3px}
.d{font-size:13px;font-weight:600;grid-column:1 / -1;margin-top:-6px;text-align:right}
.good{color:var(--good)} .bad{color:var(--bad)} .flat{color:var(--muted)}
.spark{width:74px;height:28px}
.dim{color:var(--muted);font-size:14px}
details{border-top:1px solid var(--line)}
summary{padding:14px 0;font-weight:600;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rank{padding:10px 0;border-bottom:1px solid var(--line)}
.rank .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:15px 4px;color:var(--muted);font-weight:600;font-size:15px;border-top:4px solid transparent;margin-top:-1.5px}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%}
#toast.on{opacity:1}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

.av{border-radius:50%;object-fit:cover;background:var(--line);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.who{display:flex;align-items:center;gap:12px}
.phead{display:flex;align-items:center;gap:16px;margin:4px 0 6px}
.avl{cursor:pointer;position:relative;display:block;margin:0}
.avl input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;border:1.5px solid currentColor}
.c-ok{color:var(--good)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-low{color:var(--low)}.c-na{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stats div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.stats .num{font-size:34px;font-weight:800;line-height:1;display:block}
.stats small{color:var(--muted);font-size:13px}
.lr{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;color:inherit;text-align:left}
.lr .big{font-size:34px;font-weight:800;line-height:1;text-align:right}
.alert{background:var(--surface);border:1.5px solid var(--bad);border-radius:12px;padding:12px 14px;margin:16px 0}
.map{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.note{color:var(--muted);font-size:13px;margin-top:18px}

nav button{font-size:14px;padding:15px 2px}
.tw{overflow-x:auto;margin-top:12px}
.tb{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.tb th{color:var(--muted);font-weight:500;text-align:right;padding:8px 6px;border-bottom:1.5px solid var(--ink)}
.tb td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb tr.avg td{font-weight:600;background:var(--surface)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<nav aria-label="Ana menü">
  <button id="n-athletes" onclick="go('athletes')">Sporcular</button>
  <button id="n-load" onclick="go('load')">Yük</button>
  <button id="n-gps" onclick="go('gps')">GPS</button>
  <button id="n-entry" onclick="go('entry')" style="display:none">Test</button>
  <button id="n-prog" onclick="go('prog')">Program</button>
  <button id="n-inbox" onclick="go('inbox')">Gelen</button>
  <button id="n-team" onclick="go('team')">Takım</button>
  <button id="n-matches" onclick="go('matches')">Maçlar</button>
  <button id="n-staff" onclick="go('staff')">Antrenörler</button>
</nav>

<script>
// ---------- Veri ----------
var db = {athletes:[], records:[], gps:[], v:6};
function save(){}
function uid(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function lISO(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function today(){ return lISO(new Date()); }
function daysAgo(n){ var d=new Date(); d.setDate(d.getDate()-n); return lISO(d); }

// ---------- Ölçümler ----------
// anahtar: [ad, birim, iyi yön, ondalık]
var M = {
  s10:['10 m','s','low',2], s20:['20 m','s','low',2], s30:['30 m','s','low',2],
  cmjH:['CMJ yükseklik','cm','high',1], cmjT:['CMJ kalkışa kadar süre','ms','low',0], cmjRsi:['CMJ RSI mod','','high',2],
  sjH:['SJ yükseklik','cm','high',1], eur:['CMJ / SJ oranı','','none',2],
  djH:['DJ sıçrama','cm','high',1], djGct:['DJ yer temas','ms','low',0], djRsi:['DJ RSI','','high',2],
  agR:['5-0-5 sağ','s','low',2], agL:['5-0-5 sol','s','low',2], agDiff:['5-0-5 sağ/sol farkı','%','low',1],
  slR:['Tek bacak hop sağ','cm','high',0], slL:['Tek bacak hop sol','cm','high',0], slLsi:['Bacak simetrisi (LSI)','%','high',1],
  hopH:['Hop sıçrama','cm','high',1], hopGct:['Hop yer temas','ms','low',0], hopRsi:['Hop RSI','','high',2],
  vmax:['Maksimum sprint hızı','km/sa','high',1], ift:['30-15 IFT (VIFT)','km/sa','high',1]
};
// Test grupları: f = giriş alanları [anahtar, ad, birim], m = gösterilen ölçümler
var T = [
  {n:'Sprint 10-20-30 m', f:[['s10','10 m','s'],['s20','20 m','s'],['s30','30 m','s']], m:['s10','s20','s30']},
  {n:'CMJ', f:[['cmjH','Sıçrama yüksekliği','cm'],['cmjT','Kalkışa kadar süre','ms']], m:['cmjH','cmjT','cmjRsi']},
  {n:'SJ', f:[['sjH','Sıçrama yüksekliği','cm']], m:['sjH','eur']},
  {n:'DJ', f:[['djD','Düşüş yüksekliği','cm'],['djH','Sıçrama yüksekliği','cm'],['djGct','Yer temas süresi','ms']], m:['djH','djGct','djRsi']},
  {n:'5-0-5 çeviklik', f:[['agR','Sağ bacak','s'],['agL','Sol bacak','s']], m:['agR','agL','agDiff']},
  {n:'Tek bacak hop', f:[['slR','Sağ bacak','cm'],['slL','Sol bacak','cm']], m:['slR','slL','slLsi']},
  {n:'Hop test', f:[['hopH','Sıçrama yüksekliği','cm'],['hopGct','Yer temas süresi','ms']], m:['hopH','hopGct','hopRsi']},
  {n:'Maksimum sprint hızı', f:[['vmax','Hız','km/sa']], m:['vmax']},
  {n:'30-15 IFT', f:[['ift','Son tamamlanan hız (VIFT)','km/sa']], m:['ift']}
];

function derive(v){
  var o = Object.assign({}, v);
  if (v.cmjH && v.cmjT) o.cmjRsi = (v.cmjH/100)/(v.cmjT/1000);
  if (v.cmjH && v.sjH) o.eur = v.cmjH / v.sjH;
  if (v.djH && v.djGct) o.djRsi = (v.djH/100)/(v.djGct/1000);
  if (v.hopH && v.hopGct) o.hopRsi = (v.hopH/100)/(v.hopGct/1000);
  if (v.agR && v.agL) o.agDiff = Math.abs(v.agR - v.agL)/Math.min(v.agR, v.agL)*100;
  if (v.slR && v.slL) o.slLsi = Math.min(v.slR, v.slL)/Math.max(v.slR, v.slL)*100;
  return o;
}
function series(aid, key){
  return db.records.filter(function(r){return r.a===aid;})
    .sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;})
    .map(function(r){return {d:r.d, v:derive(r.v)[key]};})
    .filter(function(p){return p.v!=null && isFinite(p.v);});
}
function fmt(k, v){ return Number(v).toFixed(M[k][3]); }
function trDate(s){ var p=s.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }

// ---------- Durum ----------
var view='athletes', selA=null, showAdd=false, entryA=null, teamKey='cmjH', pendingDel=null;

function go(v, id){ view=v; if(id!==undefined) selA=id; pendingDel=null; render(); window.scrollTo(0,0); }
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.className='on'; clearTimeout(toast.t); toast.t=setTimeout(function(){e.className='';},2200); }

// ---------- Ekranlar ----------
function render(){
  var app=document.getElementById('app');
  ['athletes','entry','team'].forEach(function(k){
    var b=document.getElementById('n-'+k);
    var active = (view===k) || (k==='athletes' && view==='profile');
    if (active) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  if (view==='athletes') app.innerHTML = vAthletes();
  else if (view==='profile') app.innerHTML = vProfile();
  else if (view==='entry') app.innerHTML = vEntry();
  else app.innerHTML = vTeam();
}

function lastDate(aid){
  var ds=db.records.filter(function(r){return r.a===aid;}).map(function(r){return r.d;}).sort();
  return ds.length ? ds[ds.length-1] : null;
}
function age(y){ return y ? (new Date().getFullYear()-y) : null; }

function vAthletes(){
  var h = '<h1>Sporcular</h1><p class="sub">' + (db.athletes.length ? db.athletes.length + ' sporcu kayıtlı' : 'Takımını buradan yönet') + '</p>';
  h += '<div class="row"><button class="btn" onclick="showAdd=!showAdd;render()">' + (showAdd?'Formu kapat':'Sporcu ekle') + '</button></div>';
  if (showAdd){
    h += '<div class="form"><label for="an">Ad soyad</label><input id="an" autocomplete="off">' +
      '<label for="ap">Pozisyon</label><select id="ap"><option>Kaleci</option><option>Defans</option><option selected>Orta saha</option><option>Forvet</option></select>' +
      '<label for="ay">Doğum yılı</label><input id="ay" inputmode="numeric" placeholder="2008">' +
      '<div class="row" style="margin-top:16px"><button class="btn" onclick="addAthlete()">Sporcuyu kaydet</button></div></div>';
  }
  if (!db.athletes.length){
    h += '<div class="empty"><p>Henüz sporcu yok. İlk sporcunu ekle.</p>' +
      '</div>';
    return h;
  }
  h += '<div class="list">';
  db.athletes.slice().sort(function(a,b){return a.n.localeCompare(b.n,'tr');}).forEach(function(a){
    var ld=lastDate(a.id), ag=age(a.y);
    h += '<button class="item" onclick="go(\'profile\',\''+a.id+'\')"><div><b>'+esc(a.n)+'</b><br><span>'+esc(a.p)+(ag?', '+ag+' yaş':'')+'</span></div><span>'+(ld?'Son test '+trDate(ld):'Test yok')+'</span></button>';
  });
  h += '</div>';
  return h;
}

function addAthlete(){
  var n=document.getElementById('an').value.trim();
  if(!n){ toast('Ad soyad gir.'); return; }
  var y=parseInt(document.getElementById('ay').value,10);
  db.athletes.push({id:uid(), n:n, p:document.getElementById('ap').value, y:isFinite(y)?y:null});
  save(); showAdd=false; render(); toast('Sporcu kaydedildi');
}

function sparkline(pts, key){
  if (pts.length<2) return '<span class="dim"></span>';
  var vals=pts.map(function(p){return p.v;}), mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), rg=(mx-mn)||1;
  var w=74,h=28,pad=3, xy=vals.map(function(v,i){
    return (pad+i*(w-2*pad)/(vals.length-1)).toFixed(1)+','+(h-pad-(v-mn)/rg*(h-2*pad)).toFixed(1);
  });
  var last=xy[xy.length-1].split(',');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><polyline points="'+xy.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="3" fill="var(--accent)"/></svg>';
}

function vProfile(){
  var a=db.athletes.find(function(x){return x.id===selA;});
  if(!a){ view='athletes'; return vAthletes(); }
  var ag=age(a.y);
  var h='<button class="back" onclick="go(\'athletes\')">Sporcu listesine dön</button><h1>'+esc(a.n)+'</h1><p class="sub">'+esc(a.p)+(ag?', '+ag+' yaş':'')+'</p>';
  h+='<div class="row"><button class="btn" onclick="entryA=\''+a.id+'\';go(\'entry\')">Test gir</button></div>';
  var any=false;
  T.forEach(function(g){
    var rows='';
    g.m.forEach(function(k){
      var s=series(a.id,k); if(!s.length) return;
      any=true;
      var last=s[s.length-1], prev=s.length>1?s[s.length-2]:null, dh='';
      if(prev){
        var dl=last.v-prev.v, good=M[k][2]==='high'?dl>0:M[k][2]==='low'?dl<0:null;
        var cls = Math.abs(dl)<1e-9 ? 'flat' : good===null ? 'flat' : good?'good':'bad';
        var pc = prev.v ? dl/prev.v*100 : 0;
        dh='<div class="d '+cls+'">'+(dl>0?'+':'')+dl.toFixed(M[k][3])+' '+M[k][1]+' ('+(pc>0?'+':'')+pc.toFixed(1)+'%) önceki teste göre</div>';
      }
      rows+='<div class="m"><div class="l">'+M[k][0]+'<br><span class="dim">'+trDate(last.d)+'</span></div><div class="v"><span class="num">'+fmt(k,last.v)+'</span><small>'+M[k][1]+'</small></div>'+sparkline(s,k)+dh+'</div>';
    });
    if(rows) h+='<div class="grp"><h2>'+g.n+'</h2>'+rows+'</div>';
  });
  if(!any) h+='<div class="empty"><p>Bu sporcu için henüz test kaydı yok.</p></div>';
  var recs=db.records.filter(function(r){return r.a===a.id;}).sort(function(x,y){return x.d<y.d?1:-1;});
  if(recs.length){
    h+='<div class="grp"><h2>Kayıtlar</h2>';
    recs.forEach(function(r){
      var n=Object.keys(r.v).length, arm=pendingDel===r.id;
      h+='<div class="m" style="grid-template-columns:1fr auto"><div class="l">'+trDate(r.d)+'<br><span class="dim">'+n+' değer girildi</span></div><button class="btn small danger" onclick="delRec(\''+r.id+'\')">'+(arm?'Silmeyi onayla':'Sil')+'</button></div>';
    });
    h+='</div>';
  }
  var armA=pendingDel===('a'+a.id);
  h+='<div class="grp"><button class="btn small danger" onclick="delAth(\''+a.id+'\')">'+(armA?'Sporcuyu ve tüm kayıtlarını silmeyi onayla':'Sporcuyu sil')+'</button></div>';
  return h;
}
function delRec(id){
  if(pendingDel!==id){ pendingDel=id; render(); return; }
  db.records=db.records.filter(function(r){return r.id!==id;}); pendingDel=null; save(); render(); toast('Kayıt silindi');
}
function delAth(id){
  if(pendingDel!=='a'+id){ pendingDel='a'+id; render(); return; }
  db.athletes=db.athletes.filter(function(x){return x.id!==id;});
  db.records=db.records.filter(function(r){return r.a!==id;});
  pendingDel=null; save(); go('athletes'); toast('Sporcu silindi');
}

function vEntry(){
  var h='<h1>Test girişi</h1><p class="sub">Yaptığın testlerin değerlerini gir, boş bıraktıkların kaydedilmez.</p>';
  if(!db.athletes.length) return h+'<div class="empty"><p>Önce bir sporcu eklemelisin.</p><button class="btn" onclick="go(\'athletes\')">Sporculara git</button></div>';
  if(!entryA || !db.athletes.some(function(a){return a.id===entryA;})) entryA=db.athletes[0].id;
  h+='<label for="ea">Sporcu</label><select id="ea" onchange="entryA=this.value">';
  db.athletes.slice().sort(function(a,b){return a.n.localeCompare(b.n,'tr');}).forEach(function(a){
    h+='<option value="'+a.id+'"'+(a.id===entryA?' selected':'')+'>'+esc(a.n)+'</option>';
  });
  h+='</select><label for="ed">Test tarihi</label><input id="ed" type="date" value="'+today()+'">';
  h+='<div style="margin-top:18px;border-bottom:1px solid var(--line)">';
  T.forEach(function(g){
    h+='<details><summary>'+g.n+'</summary><div class="two" style="padding-bottom:12px">';
    g.f.forEach(function(f){
      h+='<div><label for="f-'+f[0]+'">'+f[1]+' ('+f[2]+')</label><input id="f-'+f[0]+'" data-k="'+f[0]+'" inputmode="decimal" autocomplete="off"></div>';
    });
    h+='</div></details>';
  });
  h+='</div><div class="row" style="margin-top:18px"><button class="btn" onclick="saveEntry()">Testi kaydet</button></div>';
  h+='<p class="dim" style="margin-top:14px">RSI mod, RSI, simetri ve fark değerleri otomatik hesaplanır.</p>';
  return h;
}
function saveEntry(){

<script>
// ===== GPS ham veri ekranı =====
var gpsDate=null, WD=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'], MDT={3:'MD',4:'MD+1',5:'MD+2',6:'MD-4',0:'MD-3',1:'MD-2',2:'MD-1'};
function wd(d){return new Date(d+'T12:00:00Z').getUTCDay();}
function dlabel(d){var w=wd(d);return trDate(d)+' '+WD[w]+' ('+MDT[w]+')';}
function n0(x){return x==null?'-':Math.round(x).toLocaleString('tr-TR');}
function vGps(){
  var h='<h1>GPS verileri</h1><p class="sub">Günlük ham değerler, sporcu bazında</p>';
  var dates=Object.keys(db.gps.reduce(function(o,g){o[g.d]=1;return o;},{})).sort().reverse();
  if(!dates.length)return h+'<div class="empty"><p>Henüz GPS verisi yok. Yük sekmesinden CSV aktar.</p></div>';
  if(!gpsDate||dates.indexOf(gpsDate)<0)gpsDate=dates[0];
  h+='<label for="gd">Seans günü</label><select id="gd" onchange="gpsDate=this.value;render()">'+dates.map(function(d){return '<option value="'+d+'"'+(d===gpsDate?' selected':'')+'>'+dlabel(d)+'</option>';}).join('')+'</select>';
  var rows=db.gps.filter(function(g){return g.d===gpsDate}).map(function(g){return {a:db.athletes.find(function(x){return x.id===g.a}),g:g}}).filter(function(r){return r.a});
  rows.sort(function(x,y){return (y.g.td||0)-(x.g.td||0)});
  function avg(k){var v=rows.filter(function(r){return r.g[k]!=null}).map(function(r){return r.g[k]});return v.length?v.reduce(function(a,b){return a+b},0)/v.length:null;}
  h+='<div class="tw"><table class="tb"><thead><tr><th>Sporcu</th><th>Total Dist. (m)</th><th>HSR (m)</th><th>Sprint (m)</th><th>PL</th><th>ACC</th><th>DEC</th><th>RS</th><th>HRV</th><th>Avg HR</th><th>HML</th></tr></thead><tbody>';
  h+='<tr class="avg"><td>Takım ortalaması</td><td>'+n0(avg('td'))+'</td><td>'+n0(avg('hsr'))+'</td><td>'+n0(avg('spr'))+'</td><td>'+n0(avg('pl'))+'</td>'+['acc','dec','rs','hrv','hr','hml'].map(function(k){return '<td>'+n0(avg(k))+'</td>'}).join('')+'</tr>';
  rows.forEach(function(r){h+='<tr><td><button class="back" style="margin:0;padding:0;color:var(--ink)" onclick="go(\'profile\',\''+r.a.id+'\')">'+esc(r.a.n)+'</button></td><td>'+n0(r.g.td)+'</td><td>'+n0(r.g.hsr)+'</td><td>'+n0(r.g.spr)+'</td><td>'+n0(r.g.pl)+'</td>'+['acc','dec','rs','hrv','hr','hml'].map(function(k){return '<td>'+n0(r.g[k])+'</td>'}).join('')+'</tr>';});
  h+='</tbody></table></div><p class="dim" style="margin-top:8px">HSR: High Speed Running, PL: Player Load, ACC/DEC: count (>3 m/s²), RS: Repeated Sprint sayısı, HRV: rMSSD (ms), Avg HR: ortalama nabız. Maç günü çarşamba, MD etiketleri ona göre.</p>';
  // takım günlük ortalama, son 28 gün
  var end=new Date(dates[0]+'T00:00:00Z'),days=[];
  for(var i=27;i>=0;i--){var d=new Date(end);d.setUTCDate(d.getUTCDate()-i);var k=d.toISOString().slice(0,10),v=db.gps.filter(function(g){return g.d===k&&g.td!=null});days.push(v.length?v.reduce(function(a,g){return a+g.td},0)/v.length:0);}
  h+='<div class="grp"><h2>Takım günlük Total Distance ortalaması</h2><div style="padding:12px 0">'+bars(days)+'<span class="dim">Son 28 gün, parlak çubuklar son 7 gün</span></div></div>';
  return h;
}
// profil: son seanslar tablosu
var _vp3=vProfile;
vProfile=function(){
  var h=_vp3();if(view!=='profile')return h;
  var rs=db.gps.filter(function(g){return g.a===selA}).sort(function(x,y){return x.d<y.d?1:-1});rs=rs.filter(function(g){return g.d>=dAdd(wkStartOf(rs[0].d),-14)});
  if(!rs.length)return h;
  var t='<div class="grp"><h2>Son GPS seansları</h2><div class="tw">'+gtab(rs,'tb')+'</div><p class="dim" style="margin:6px 0 0">Hafta satırı: yük değerleri toplam, HRV ve Avg HR ortalama, Max Speed haftanın en yükseği. Hafta, maç döngüsüne göre perşembeden çarşambaya.</p></div>';
  var a='<div class="grp"><h2>Kayıtlar</h2>';
  return h.indexOf(a)>-1?h.replace(a,t+a):h+t;

var _r2=render;
function setNav(){['athletes','load','gps','entry','team'].forEach(function(k){var b=document.getElementById('n-'+k);var on=(view===k)||(k==='athletes'&&view==='profile');if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
render=function(){

<script>
// ===== Faz 3: çarşamba maçı, yeni GPS alanları, karşılaştırma, PDF =====
LK.acc=['ACC',''];LK.dec=['DEC',''];LK.rs=['Repeated Sprint (RS)',''];
function byname(a,b){return a.n.localeCompare(b.n,'tr');}
var _ld5=loadDemo;
loadDemo=function(){
  _ld5();
  var seed=33;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
  var F={3:1.8,4:.3,5:.6,6:1.0,0:0,1:1.1,2:.5},HF={4:.82,5:.92};
  db.gps=[];
  db.athletes.forEach(function(a,ix){
    var q=(rnd()-.5)*2,gk=a.p==='Kaleci',pf=gk?.45:a.p==='Orta saha'?1.1:a.p==='Forvet'?.95:1,hb=66+12*q;
    for(var i=60;i>=0;i--){
      var d=daysAgo(i),w=wd(d),f=F[w];if(!f)continue;
      var sp=0;f*=pf;
      if((ix===3||ix===9)&&i<7){f*=1.75;sp=1;} if(ix===5&&i<14)f*=.6; if(ix===12&&i<7){f*=1.38;sp=1;}
      var nz=function(){return 1+(rnd()-.5)*.16};
      db.gps.push({id:uid(),a:a.id,d:d,td:Math.round(5600*f*nz()),hsr:Math.round(420*f*nz()),spr:Math.round(95*f*nz()),pl:Math.round(460*f*nz()),rs:Math.round(3.6*f*nz()),acc:Math.round(38*f*nz()),dec:Math.round(34*f*nz()),hrv:Math.round(hb*(HF[w]||1)*(sp&&i<4?.8:1)*(1+(rnd()-.5)*.1)),hr:Math.round(112+17*Math.min(f,1.9)*(1+(rnd()-.5)*.04))});
    }
  });
  db.v=2;save();render();toast('Örnek veri yüklendi');
};

// ---- Yüzdelik ve radar
var RAX=['s10','s30','cmjH','cmjRsi','djRsi','agR','slLsi','vmax','ift'],RLB={s10:'10 m',s30:'30 m',cmjH:'CMJ',cmjRsi:'RSI mod',djRsi:'DJ RSI',agR:'5-0-5',slLsi:'LSI',vmax:'Vmaks',ift:'IFT'};
function lastV(aid,k){var s=series(aid,k);return s.length?s[s.length-1].v:null;}
function pct(aid,k){var vs=act().map(function(a){return lastV(a.id,k)}).filter(function(v){return v!=null}),me=lastV(aid,k);if(me==null||vs.length<2)return null;var w=vs.filter(function(v){return M[k][2]==='low'?v>me:v<me}).length;return w/(vs.length-1)*100;}
function radar(list,cols,ink,grid){
  var cx=170,cy=165,R=100,n=RAX.length;function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];}
  var o='<svg viewBox="0 0 340 330" width="100%" style="max-width:380px;display:block;margin:0 auto" role="img" aria-label="Takım içi yüzdelik radar grafiği">';
  [25,50,75,100].forEach(function(l){o+='<polygon points="'+RAX.map(function(_,i){return pt(i,R*l/100).join(',')}).join(' ')+'" style="fill:none;stroke:'+grid+'"/>';});
  RAX.forEach(function(k,i){var p=pt(i,R),q=pt(i,R+17);o+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" style="stroke:'+grid+'"/><text x="'+q[0]+'" y="'+q[1]+'" text-anchor="middle" dominant-baseline="middle" style="font-size:11px;fill:'+ink+'">'+RLB[k]+'</text>';});
  list.forEach(function(id,j){if(!id)return;o+='<polygon points="'+RAX.map(function(k,i){var v=pct(id,k);return pt(i,R*(v==null?0:v)/100).join(',')}).join(' ')+'" style="fill:'+cols[j]+';fill-opacity:.18;stroke:'+cols[j]+';stroke-width:2"/>';});
  return o+'</svg>';
}
function gLast(aid,k){var r=db.gps.filter(function(g){return g.a===aid&&g[k]!=null}).sort(function(x,y){return x.d<y.d?1:-1});return r.length?r[0][k]:null;}
function hrAvg(aid){var r=db.gps.filter(function(g){return g.a===aid&&g.hr!=null}).sort(function(x,y){return x.d<y.d?1:-1}).slice(0,7);return r.length?r.reduce(function(a,g){return a+g.hr},0)/r.length:null;}

// ---- Karşılaştırma (Takım sekmesinde)
var teamMode='rank',cmpIds=[null,null,null],_vt=vTeam;
function okId(id){return id&&db.athletes.some(function(x){return x.id===id});}
vTeam=function(){
  var tog='<div class="row" style="margin-bottom:8px"><button class="btn small'+(teamMode==='rank'?'':' ghost')+'" onclick="teamMode=\'rank\';render()">Sıralama</button><button class="btn small'+(teamMode==='cmp'?'':' ghost')+'" onclick="teamMode=\'cmp\';render()">Karşılaştırma</button><button class="btn small ghost" onclick="teamPdf()">Takım PDF raporu</button></div>';
  if(teamMode==='cmp')return '<h1>Takım</h1><p class="sub">Sporcuları yan yana karşılaştır</p>'+tog+vCmp();
  return _vt().replace('</p>','</p>'+tog);
};
function vCmp(){
  if(db.athletes.length<2)return '<div class="empty"><p>Karşılaştırma için en az 2 sporcu gerekli.</p></div>';
  var so=db.athletes.slice().sort(byname);
  if(!okId(cmpIds[0]))cmpIds[0]=so[0].id; if(!okId(cmpIds[1])||cmpIds[1]===cmpIds[0])cmpIds[1]=so.filter(function(x){return x.id!==cmpIds[0]})[0].id; if(!okId(cmpIds[2]))cmpIds[2]=null;
  var h='';
  [0,1,2].forEach(function(j){h+='<label for="cs'+j+'">Sporcu '+(j+1)+(j===2?' (isteğe bağlı)':'')+'</label><select id="cs'+j+'" onchange="cmpIds['+j+']=this.value||null;render()">'+(j===2?'<option value="">Yok</option>':'')+so.map(function(a){return '<option value="'+a.id+'"'+(a.id===cmpIds[j]?' selected':'')+'>'+esc(a.n)+'</option>'}).join('')+'</select>';});
  var cols=['var(--accent)','var(--warn)','var(--low)'],ids=cmpIds.filter(Boolean);
  h+='<div style="margin-top:18px">'+radar(cmpIds,cols,'var(--muted)','var(--line)')+'</div><div class="row" style="justify-content:center;margin:4px 0">'+cmpIds.map(function(id,j){return id?'<span class="chip" style="color:'+cols[j]+'">'+esc(db.athletes.find(function(x){return x.id===id}).n)+'</span>':''}).join('')+'</div><p class="dim" style="text-align:center">Eksenler takım içi yüzdelik dilimdir (100 = takımın en iyisi).</p>';
  function row(lbl,vals,unit,dir,d){var best=-1;if(dir!=='none'){var nn=vals.filter(function(v){return v!=null});if(nn.length>1){var t=dir==='low'?Math.min.apply(null,nn):Math.max.apply(null,nn);best=vals.indexOf(t);}}return '<tr><td>'+lbl+'</td>'+vals.map(function(v,i){return '<td'+(i===best?' class="good" style="font-weight:600"':'')+'>'+(v==null?'-':v.toFixed(d))+'</td>'}).join('')+'</tr>';}
  var t='<div class="tw"><table class="tb" style="min-width:300px"><thead><tr><th>Ölçüm</th>'+ids.map(function(id){return '<th>'+esc(db.athletes.find(function(x){return x.id===id}).n.split(' ')[0])+'</th>'}).join('')+'</tr></thead><tbody>';
  T.forEach(function(g){g.m.forEach(function(k){var v=ids.map(function(id){return lastV(id,k)});if(v.some(function(x){return x!=null}))t+=row(M[k][0]+(M[k][1]?' ('+M[k][1]+')':''),v,M[k][1],M[k][2],M[k][3]);});});
  t+=row('ACWR (Total Distance)',ids.map(function(id){var e=ewma(id,'td');return e&&e.n>=28?e.r:null}),'','none',2)+row('HRV son değer (ms)',ids.map(function(id){return gLast(id,'hrv')}),'','high',0)+row('Ort. nabız, son 7 seans',ids.map(hrAvg),'','none',0);
  return h+t+'</tbody></table></div><p class="dim" style="margin-top:8px">Yeşil kalın değer, seçilenler arasında en iyisidir.</p>';
}

// ---- PDF
var RS='<style>.r{padding:36px 40px;font-size:12px;line-height:1.45;color:#12212B;background:#fff}.r h1{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-size:36px;margin:0;line-height:1.05}.r h2{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-size:19px;margin:22px 0 6px;border-top:2px solid #12212B;padding-top:8px}.r table{width:100%;border-collapse:collapse}.r th{text-align:right;color:#5B6B75;font-weight:500;padding:5px 4px;border-bottom:1.5px solid #12212B}.r td{text-align:right;padding:5px 4px;border-bottom:1px solid #D5DDE1}.r th:first-child,.r td:first-child{text-align:left}.r .g{color:#17794F;font-weight:600}.r .b{color:#C62F47;font-weight:600}.r .w{color:#9A6200;font-weight:600}.r .m{color:#5B6B75}.r .ft{margin-top:26px;color:#5B6B75;font-size:10px}</style>';
function bcls(c){return c==='c-ok'?'g':c==='c-bad'?'b':c==='c-warn'?'w':'m';}
function barsC(days,col){var mx=Math.max.apply(null,days)||1,w=500/days.length;return '<svg viewBox="0 0 500 70" width="100%" height="70">'+days.map(function(v,i){var h=Math.max(1,v/mx*66);return '<rect x="'+(i*w+1).toFixed(1)+'" y="'+(70-h).toFixed(1)+'" width="'+(w-3).toFixed(1)+'" height="'+h.toFixed(1)+'" style="fill:'+col+';fill-opacity:'+(i>=days.length-7?1:.45)+'"/>';}).join('')+'</svg>';}
function gtab(rs){return '<table><thead><tr><th>Gün</th><th>Total Dist.</th><th>HSR</th><th>Sprint</th><th>PL</th><th>ACC</th><th>DEC</th><th>RS</th><th>HRV</th><th>Avg HR</th><th>HML</th></tr></thead><tbody>'+rs.map(function(g){return '<tr><td>'+dlabel(g.d)+'</td>'+['td','hsr','spr','pl','acc','dec','rs','hrv','hr','hml'].map(function(k){return '<td>'+n0(g[k])+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>';}
function athRep(a){
  var ag=age(a.y),h=RS+'<div class="r"><h1>'+esc(a.n)+'</h1><div class="m">'+esc(a.p)+(ag?', '+ag+' yaş':'')+' · Rapor tarihi '+trDate(today())+'</div><h2>Testler</h2><table><thead><tr><th>Ölçüm</th><th>Değer</th><th>Önceki testten değişim</th><th>Takım yüzdeliği</th></tr></thead><tbody>';
  T.forEach(function(g){g.m.forEach(function(k){var s=series(a.id,k);if(!s.length)return;var l=s[s.length-1],pv=s.length>1?s[s.length-2]:null,dc='',dl='';if(pv){var d=l.v-pv.v,gd=M[k][2]==='high'?d>0:M[k][2]==='low'?d<0:null;dc=gd===null||Math.abs(d)<1e-9?'m':gd?'g':'b';dl=(d>0?'+':'')+d.toFixed(M[k][3]);}var pc=pct(a.id,k);h+='<tr><td>'+M[k][0]+'</td><td>'+fmt(k,l.v)+' '+M[k][1]+'</td><td class="'+dc+'">'+(dl||'-')+'</td><td>'+(pc==null?'-':'P'+Math.round(pc))+'</td></tr>';});});
  h+='</tbody></table><div style="margin-top:10px">'+radar([a.id],['#0E7A55'],'#12212B','#C9D3D8')+'</div>';
  var e=ewma(a.id,'td');
  if(e){var b=band(e);h+='<h2>Yük ve risk</h2><table><thead><tr><th>Yük ölçüsü</th><th>Akut</th><th>Kronik</th><th>ACWR</th><th>Durum</th></tr></thead><tbody>';
    Object.keys(LK).forEach(function(k){var x=ewma(a.id,k);if(!x||x.r==null)return;var bb=band(x);h+='<tr><td>'+LK[k][0]+'</td><td>'+n0(x.ac)+'</td><td>'+n0(x.ch)+'</td><td>'+x.r.toFixed(2)+'</td><td class="'+bcls(bb[1])+'">'+bb[0]+'</td></tr>';});
    h+='</tbody></table><div style="margin-top:10px">'+barsC(e.days,'#0E7A55')+'<div class="m">Günlük Total Distance, son 28 gün (koyu çubuklar son 7 gün)</div></div>';
    var rs=db.gps.filter(function(g){return g.a===a.id}).sort(function(x,y){return x.d<y.d?1:-1});rs=rs.filter(function(g){return g.d>=dAdd(wkStartOf(rs[0].d),-7)});
    h+='<h2>Son GPS seansları</h2>'+gtab(rs)+'<div class="m" style="margin-top:4px">Hafta satırı: yük değerleri toplam, HRV ve Avg HR ortalama, Max Speed haftanın en yükseği.</div>';}
  return h+'<div class="ft">ACWR eşikleri (0,8-1,3 hedef bölge, 1,5 üzeri yüksek) literatürdeki yaygın değerlerdir; tek başına sakatlık tahmini değildir. Karar antrenör ve sağlık ekibine aittir.</div></div>';
}
function teamRep(){
  var h=RS+'<div class="r"><h1>Takım raporu</h1><div class="m">'+db.athletes.length+' sporcu · Rapor tarihi '+trDate(today())+'</div><h2>Yük ve risk (Total Distance)</h2><table><thead><tr><th>Sporcu</th><th>Akut</th><th>Kronik</th><th>ACWR</th><th>Durum</th></tr></thead><tbody>';
  act().map(function(a){return {a:a,e:ewma(a.id,'td')}}).filter(function(r){return r.e&&r.e.r!=null}).sort(function(x,y){return y.e.r-x.e.r}).forEach(function(r){var b=band(r.e);h+='<tr><td>'+esc(r.a.n)+'</td><td>'+n0(r.e.ac)+'</td><td>'+n0(r.e.ch)+'</td><td>'+r.e.r.toFixed(2)+'</td><td class="'+bcls(b[1])+'">'+b[0]+'</td></tr>';});
  h+='</tbody></table><h2>Test özeti (son değerler)</h2><table><thead><tr><th>Ölçüm</th><th>Takım ortalaması</th><th>En iyi</th></tr></thead><tbody>';
  T.forEach(function(g){g.m.forEach(function(k){var v=act().map(function(a){return {a:a,v:lastV(a.id,k)}}).filter(function(x){return x.v!=null});if(!v.length)return;var mean=v.reduce(function(s,x){return s+x.v},0)/v.length,bs=v.slice().sort(function(x,y){return M[k][2]==='low'?x.v-y.v:y.v-x.v})[0];h+='<tr><td>'+M[k][0]+'</td><td>'+fmt(k,mean)+' '+M[k][1]+'</td><td>'+(M[k][2]==='none'?'-':esc(bs.a.n)+' ('+fmt(k,bs.v)+')')+'</td></tr>';});});
  var ds=db.gps.map(function(g){return g.d}).sort();
  if(ds.length){var ld=ds[ds.length-1],rs=db.gps.filter(function(g){return g.d===ld}).map(function(g){return {a:db.athletes.find(function(x){return x.id===g.a}),g:g}}).filter(function(r){return r.a}).sort(function(x,y){return (y.g.td||0)-(x.g.td||0)});
    h+='<h2>Son seans: '+dlabel(ld)+'</h2><table><thead><tr><th>Sporcu</th><th>Total Dist.</th><th>HSR</th><th>Sprint</th><th>PL</th><th>ACC</th><th>DEC</th><th>RS</th><th>HRV</th><th>Avg HR</th><th>HML</th></tr></thead><tbody>'+rs.map(function(r){return '<tr><td>'+esc(r.a.n)+'</td>'+['td','hsr','spr','pl','acc','dec','rs','hrv','hr','hml'].map(function(k){return '<td>'+n0(r.g[k])+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>';}
  return h+'<div class="ft">HSR: High Speed Running, PL: Player Load, ACC/DEC: count (>3 m/s²), RS: Repeated Sprint sayısı, HRV: rMSSD (ms), Avg HR: ortalama nabız. ACWR tek başına sakatlık tahmini değildir.</div></div>';
}
function loadScript(src){return new Promise(function(res,rej){var e=document.createElement('script');e.src=src;e.onload=res;e.onerror=rej;document.head.appendChild(e);});}
async function makePdf(html,filename){
  try{
    var dl={save:function(o){var u=URL.createObjectURL(o.data),a=document.createElement('a');a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},1500);return Promise.resolve();}};
    if(!dl){toast('Bu görünümde indirme kullanılamıyor.');return;}
    toast('PDF hazırlanıyor...');

<script>

var st=document.createElement('style');st.textContent='h3.ct{font-size:15px;margin:20px 0 6px;font-weight:600}.stg{margin-top:10px}';document.head.appendChild(st);
function ath(id){return db.athletes.find(function(x){return x.id===id});}

// ---- Çizgi ve sütun grafik
function lineChart(o){
  var W=340,H=o.h||150,L=40,Rr=10,Tp=10,B=22,all=[],xs=[];
  o.series.forEach(function(s){s.pts.forEach(function(p){all.push(p[1]);xs.push(p[0]);})});

    if(se.pts.length>1)s+='<polyline points="'+se.pts.map(function(p){return X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)}).join(' ')+'" style="fill:none;stroke:'+se.color+';stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>';
    (se.dots?se.pts:[se.pts[se.pts.length-1]]).forEach(function(p){s+='<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="3.2" style="fill:'+se.color+'"/>';});
  });
  if(o.xl)s+='<text x="'+L+'" y="'+(H-5)+'" style="font-size:10px;fill:'+o.ink+'">'+o.xl[0]+'</text><text x="'+(W-Rr)+'" y="'+(H-5)+'" text-anchor="end" style="font-size:10px;fill:'+o.ink+'">'+o.xl[1]+'</text>';
  return s+'</svg>';
}
function colChart(vals,labels,col,ink,grid){

// ---- Sakatlık hesapları
var STG=['Klinik onay ve koruma','Kontrollü koşu','Bireysel saha antrenmanı','Takımla kısmi antrenman','Takımla tam antrenman','Maça dönüş'],injForm=false,profKey=null;
function chAt(aid,key,d0){var r=ewmaSeries(aid,key).filter(function(x){return x.d<=d0});return r.length?r[r.length-1].ch:null;}
function injCalc(a){
  var d0=a.inj.date;
  function base(k){var all=series(a.id,k),sx=all.filter(function(p){return p.d<=d0});if(!sx.length)sx=all.slice(0,1);if(!sx.length)return null;var v=sx.map(function(p){return p.v});return M[k][2]==='low'?Math.min.apply(null,v):Math.max.apply(null,v);}
  function post(k){var sx=series(a.id,k).filter(function(p){return p.d>d0});return sx.length?sx[sx.length-1].v:null;}
  var crit=[],lsi=post('slLsi');
  crit.push({n:'Tek bacak hop simetrisi (LSI)',cur:lsi==null?'-':lsi.toFixed(1)+' %',tg:'%90 ve üzeri',ok:lsi==null?null:lsi>=90});
  [['cmjH','CMJ yüksekliği',.95,1],['vmax','Maks. sprint hızı',.95,1],['s30','30 m sprint',1.03,-1]].forEach(function(c){
    var b=base(c[0]),cu=post(c[0]);if(b==null||cu==null){crit.push({n:c[1],cur:'-',tg:c[3]>0?'önceki en iyinin %'+Math.round(c[2]*100)+' ve üzeri':'önceki en iyinin %'+Math.round(c[2]*100)+' ve altı',ok:null});return;}
    var r=cu/b;crit.push({n:c[1],cur:fmt(c[0],cu)+' '+M[c[0]][1]+' (%'+Math.round(r*100)+')',tg:c[3]>0?'önceki en iyinin %'+Math.round(c[2]*100)+' ve üzeri':'önceki en iyinin %'+Math.round(c[2]*100)+' ve altı',ok:c[3]>0?r>=c[2]:r<=c[2]});
  });
  var es=ewmaSeries(a.id,'td'),ch0=chAt(a.id,'td',d0),lastE=es.length?es[es.length-1]:null;
  if(ch0!=null&&lastE&&lastE.d>d0){var rr=lastE.ch/ch0;crit.push({n:'Kronik yük (Total Distance)',cur:'%'+Math.round(rr*100)+' (yaralanma öncesine göre)',tg:'%85 ve üzeri',ok:rr>=.85});}
  else crit.push({n:'Kronik yük (Total Distance)',cur:'-',tg:'%85 ve üzeri',ok:null});
  if(lastE&&lastE.d>d0&&lastE.r!=null)crit.push({n:'Güncel ACWR',cur:lastE.r.toFixed(2),tg:'1,30 ve altı',ok:lastE.r<=1.3});else crit.push({n:'Güncel ACWR',cur:'-',tg:'1,30 ve altı',ok:null});
  return {crit:crit,ch0:ch0};

function planTable(a,rep){

  var l7=db.gps.filter(function(g){return g.a===a.id&&g.td!=null&&dnum(g.d)>dnum(today())-7}).reduce(function(x,g){return x+g.td},0);
  if(wk>=1&&wk<=5){var tg=base[0]*keys[0][2][wk-1];h+='<p class="'+(rep?'m':'dim')+'" style="margin:6px 0 0">Bu hafta hedef '+n0(tg)+' m, son 7 günde gerçekleşen '+n0(l7)+' m (%'+Math.round(l7/tg*100)+').</p>';}

}
function injHtml(a,rep){
  var inj=a.inj,c=injCalc(a),days=Math.max(0,Math.round(dnum(today())-dnum(inj.date))),okc=rep?'g':'c-ok',wc=rep?'w':'c-warn';
  var h=rep?'<h2>Sakatlık ve dönüş planı</h2>':'<div class="grp"><h2>Sakatlık ve dönüş planı</h2>';
  h+='<p style="margin:8px 0">'+esc(inj.type)+', '+trDate(inj.date)+' ('+days+'. gün)'+(rep?'. Aşama: <b>'+STG[inj.stage]+'</b>':'')+'</p>';
  if(!rep)h+='<label for="stg">Rehabilitasyon aşaması</label><select id="stg" onchange="setStage(\''+a.id+'\',this.value)">'+STG.map(function(x,i){return '<option value="'+i+'"'+(i===inj.stage?' selected':'')+'>'+(i+1)+'. '+x+'</option>'}).join('')+'</select>';

  return h;

// ---- Gelen kutusu (antrenör)
var inboxAll=false;
function flags(s){var f=[];if(s.pain.some(function(p){return p.v>=7}))f.push('Yüksek şiddet');var lim=dnum(s.d)-7;if(s.pain.some(function(p){return SV().filter(function(x){return x.a===s.a&&dnum(x.d)>lim&&dnum(x.d)<=dnum(s.d)&&x.pain.some(function(q){return q.k===p.k})}).length>=3}))f.push('Tekrarlayan');return f;}

function nPitch(f){var m=/^(\d+)\s*v\s*(\d+)$/i.exec(f||'');return m?parseInt(m[1],10)+parseInt(m[2],10):null;}
function drillCalc(dr){
  var min=dr.sets*dr.mins,rows=[],sums={};
  dr.p.forEach(function(p){var a=ath(p.a);if(a)rows.push({a:a,p:p,rf:refFor(p.a,dr.d)});});
  TV.forEach(function(t){var k=t[0],vals=rows.filter(function(r){return r.p[k]!=null}).map(function(r){return r.p[k]}),mean=avgOf(vals),vol=[],den=[];

    sums[k]={mean:mean,pm:mean==null?null:mean/min,vol:avgOf(vol),den:avgOf(den)};});

  h+='<div class="row" style="margin-top:14px"><button class="btn small danger" onclick="delDrill(\''+dr.id+'\')">'+(pendingDel==='dr'+dr.id?'Silmeyi onayla':'Kaydı sil')+'</button></div><p class="note">Bu değerler gün içindeki bir bölümdür, günlük toplam GPS verisine ek olarak sayılmaz. Maç referansı sporcunun kendi maç kayıtlarından gelir.</p></div>';

function seedGps2(){
  var seed=91;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
  var LB={4:'MD+1',6:'MD-4',0:'MD-3',1:'MD-2',2:'MD-1'};db.gps=[];
  db.athletes.forEach(function(a,ix){
    var gk=a.p==='Kaleci',pf=gk?.45:a.p==='Orta saha'?1.08:a.p==='Forvet'?.97:1,q=(rnd()-.5)*2,hb=66+12*q;
    var ref={td:9800*pf*(1+q*.05),hsr:720*pf*(gk?.4:1)*(1+q*.1),spr:190*(gk?.3:1)*(1+q*.12),acc:48*(gk?.5:1)*(1+q*.06),dec:44*(gk?.5:1)*(1+q*.06),hml:2000*pf*(1+q*.06)};
    for(var i=60;i>=0;i--){
      var d=daysAgo(i),w=wd(d);if(w===5)continue;
      var g={id:uid(),a:a.id,d:d},sp=0,lab=w===3?'MD':LB[w];
      TV.forEach(function(t){var k=t[0],pc;
        if(w===3)pc=(.9+rnd()*.12)*100;else{var r=DEFT[lab][k];pc=r[0]+rnd()*(r[1]-r[0]);if(rnd()<.22)pc+=(rnd()<.5?-1:1)*(6+rnd()*14);}
        if((ix===3||ix===9)&&i<7&&w!==3){pc*=1.3;sp=1;} if(ix===5&&i<14&&w!==3)pc*=.7; if(ix===12&&i<7&&w!==3){pc*=1.2;sp=1;}
        g[k]=Math.round(ref[k]*Math.max(pc,0)/100);});
      g.pl=Math.round(g.td*.048*(1+(rnd()-.5)*.1));g.rs=Math.round(Math.max(0,g.spr/190*6*(1+(rnd()-.5)*.3)));
      g.hrv=Math.round(hb*(w===4?.93:1)*(sp&&i<4?.8:1)*(1+(rnd()-.5)*.1));g.hr=Math.round(112+40*Math.min(g.td/ref.td,1.05)*(1+(rnd()-.5)*.03));
      db.gps.push(g);
    }
  });
  var a=db.athletes[6];
  if(a&&a.inj){var d0=a.inj.date,st=a.inj.start,wk=daysAgo(7);
    db.gps=db.gps.filter(function(g){return g.a!==a.id||g.d<=d0||g.d>st});
    db.gps.forEach(function(g){if(g.a===a.id&&g.d>st){var k=g.d<=wk?.35:.6;['td','hsr','spr','pl','acc','dec','rs','hml'].forEach(function(x){if(g[x]!=null)g[x]=Math.round(g[x]*k)});if(g.d<=wk){g.hsr=0;g.spr=0;g.rs=0;g.hml=0;}}});}
}
function seedDrills(){
  var seed=55;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
  var mon=[],sun=[];for(var i=1;i<=40;i++){var d=daysAgo(i),w=wd(d);if(w===1)mon.push(d);if(w===0)sun.push(d);}
  var INT={'4v4':{td:.95,hsr:.25,spr:.05,acc:2.0,dec:1.9,hml:1.6},'8v8':{td:1.0,hsr:.85,spr:.6,acc:1.1,dec:1.1,hml:1.0}};
  var out=act().filter(function(a){return a.p!=='Kaleci'});db.drills=[];
  function mk(d,f,w,l,sets,mins,note,list){var min=sets*mins,p=[];list.forEach(function(a){var rf=refFor(a.id,d);if(!rf)return;var o={a:a.id};TV.forEach(function(t){var k=t[0];if(rf[k])o[k]=Math.round(rf[k]/REFMIN*min*INT[f][k]*(1+(rnd()-.5)*.25));});p.push(o);});db.drills.push({id:uid(),d:d,fmt:f,w:w,l:l,gk:true,sets:sets,mins:mins,note:note,p:p});}
  mk(mon[0],'4v4',30,45,4,4,'Kalede kaleci, serbest dokunuş',out.slice(0,8));
  mk(mon[1],'4v4',30,45,4,4,'',out.slice(2,10));
  mk(sun[0],'8v8',70,50,2,10,'Ofsayt serbest',out.slice(0,13));
}

function wkMatches(){
  var ds=db.gps.map(function(g){return g.d}),mx=ds.slice().sort().slice(-1)[0],ws=[],up=[],n=null;
  ds.forEach(function(d){if(wd(d)===3&&ws.indexOf(d)<0)ws.push(d);});

<script>

var wkPK='td';

function lastData(){return db.gps.map(function(g){return g.d}).sort().slice(-1)[0]||'';}
function acwrEnd(aid,key,end,over){
  var m=dMap(aid,key);Object.keys(over).forEach(function(d){m[d]=over[d]});
  var ds=Object.keys(m).sort();if(!ds.length)return null;
  var d=ds[0],la=2/8,lc=2/29,ac=null,ch=null;
  while(d<=end){var x=m[d]||0;ac=ac==null?x:la*x+(1-la)*ac;ch=ch==null?x:lc*x+(1-lc)*ch;d=dAdd(d,1);}
  return ch>0?ac/ch:null;
}
function matchAvg(aid,key){var v=db.gps.filter(function(g){return g.a===aid&&wd(g.d)===3&&g[key]>0}).sort(function(x,y){return x.d<y.d?1:-1}).slice(0,3).map(function(g){return g[key]});return avgOf(v)||0;}
function projOver(aid,key,M,sc,ref,lastD){
  var over={},dm=dMap(aid,key),mk=matchAvg(aid,key);
  wkMatches().up.filter(function(m){return m<=M}).forEach(function(m){
    var R=wRange(wkType(m),key),pct=m===M?(sc==='lo'?R[0]:sc==='hi'?R[1]:(R[0]+R[1])/2):(R[0]+R[1])/2,tgt=ref[key]*pct/100,done=0,days=[],sw=0;

}

<script>

function snapAll(){

// ---- Gönderme (yalnızca değişenler)
function setStatus(t,cls){var e=document.getElementById('sync-st');if(e){e.textContent=t;e.className=cls||'';}}
var _saveReal=function(){
  SYNC.dirty=true;setStatus('Kaydediliyor...','busy');
  clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushAll,700);
};
save=_saveReal;
function chunk(a,n){var o=[];for(var i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;}
async function pushAll(){
  if(!SBC||!ROLE||ROLE==='none')return;
  if(SYNC.busy){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushAll,500);return;}
  SYNC.busy=true;SYNC.dirty=false;
  try{
    var plan=[];
    colsFor().forEach(function(c){
      var cur={},old=SNAP[c.name]||{},up=[],dl=[];
      c.list().forEach(function(it){cur[it.id]=JSON.stringify(it.row);});
      var byId={};c.list().forEach(function(it){byId[it.id]=it.row});
      Object.keys(cur).forEach(function(id){if(old[id]!==cur[id])up.push({id:id,row:byId[id],sig:cur[id]});});
      Object.keys(old).forEach(function(id){if(cur[id]===undefined)dl.push(id);});
      plan.push({c:c,up:up,dl:dl});
    });
    // önce silmeler (çocuk tablolardan başlayarak), sonra eklemeler
    for(var i=plan.length-1;i>=0;i--){
      var p=plan[i];
      for(var j=0;j<p.dl.length;j++){
        var r=await (p.c.delRun?p.c.delRun(p.dl[j]):p.c.del(SBC.from(p.c.table).delete(),p.dl[j]));
        if(r.error)throw r.error;
        delete SNAP[p.c.name][p.dl[j]];
      }
    }
    var metaNeeded=false;
    for(var i2=0;i2<plan.length;i2++){
      var p2=plan[i2];
      for(var ch of chunk(p2.up,400)){
        var res=await (p2.c.up?p2.c.up(ch.map(function(x){return x.row})):SBC.from(p2.c.table).upsert(ch.map(function(x){return x.row}),{onConflict:p2.c.conflict}));
        if(res.error)throw res.error;
        ch.forEach(function(x){SNAP[p2.c.name][x.id]=x.sig;});
      }
      if(p2.c.name==='athletes'&&p2.up.length)metaNeeded=true;
    }
    if(metaNeeded)await refreshAthleteMeta();
    SYNC.fail=0;SYNC.last=new Date();
    if(SYNC.dirty){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushAll,300);}
    else setStatus('Kaydedildi','ok');
  }catch(e){
    SYNC.fail++;SYNC.dirty=true;
    setStatus('Kaydedilemedi, tekrar denenecek','bad');
    if(SYNC.fail===1)toast('Kayıt başarısız: '+trErr(e));
    clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushAll,Math.min(30000,4000*SYNC.fail));
  }finally{SYNC.busy=false;}
}
window.addEventListener('beforeunload',function(e){if(SYNC.dirty||SYNC.busy){e.preventDefault();e.returnValue='';}});

async function refreshAthleteMeta(){
  var r=await SBC.from('athletes').select('id,invite_code,user_id');
  if(r.error||!r.data)return;
  r.data.forEach(function(x){var a=ath(x.id);if(a){a.invite=x.invite_code;a.uid=x.user_id;}});
}

async function refreshPhotos(){
  var r=await SBC.from('athletes').select('id,photo_path');
  if(r.error||!r.data)return;
  r.data.forEach(function(x){var a=ath(x.id);if(a){if(x.photo_path)a.ph=x.photo_path;else delete a.ph;}});
}

// ---- Çekme
var ORD={athletes:['id'],injuries:['athlete_id'],test_records:['id'],gps_sessions:['id'],surveys:['id'],drills:['id'],program_days:['day'],program_exercises:['id'],exercise_done:['athlete_id','d','exercise_id'],permissions:['athlete_id'],settings:['key']};
async function fetchAll(table){
  var out=[],from=0;
  for(;;){
    var q=SBC.from(table).select('*');ORD[table].forEach(function(c){q=q.order(c)});
    var r=await q.range(from,from+999);
    if(r.error)throw r.error;
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<1000)break;
    from+=1000;
  }
  return out;
}
function mapRec(r){return {id:r.id,a:r.athlete_id,d:r.d,v:r.v||{}};}
function mapGps(r){var o={id:r.id,a:r.athlete_id,d:r.d};GK.forEach(function(k){if(r[k]!=null)o[k]=Number(r[k])});return o;}
function num(v){return v==null?null:Number(v);}
function mapSurvey(r){return {id:r.id,a:r.athlete_id,d:r.d,rpe:num(r.rpe),dur:num(r.dur),sleep:num(r.sleep),fat:r.fat==null?null:r.fat,sore:r.sore==null?null:r.sore,pain:r.pain||[],seen:!!r.seen};}
function mapProg(days,ex){
  var pr={};(days||[]).forEach(function(r){pr[r.day]={title:r.title||'',ex:[]}});
  (ex||[]).slice().sort(function(a,b){return a.day-b.day||a.sort_order-b.sort_order}).forEach(function(r){
    if(!pr[r.day])pr[r.day]={title:'',ex:[]};
    pr[r.day].ex.push({id:r.id,n:r.name,sets:r.sets||'',reps:r.reps||'',url:r.video_url||'',g:r.target||'all',note:r.note||''});
  });
  return pr;
}
function mapDone(rows){var d={};(rows||[]).forEach(function(r){d[r.athlete_id+'|'+r.d+'|'+r.exercise_id]=true});return d;}
var HT_ON=false;
function mapPerm(rows){var pm={},hs={};(rows||[]).forEach(function(r){var o={};PK.forEach(function(k){o[k]=!!r[k]});pm[r.athlete_id]=o;if(Array.isArray(r.hidden_tests)){HT_ON=true;r.hidden_tests.forEach(function(k){hs[k]=1})}});db.hideT=Object.keys(hs);return pm;}
function applyRows(T){
  db.athletes=(T.athletes||[]).map(function(r){var a={id:r.id,n:r.name,p:r.position||'Orta saha',y:r.birth_year,invite:r.invite_code,uid:r.user_id};if(r.birth_date)a.bd=String(r.birth_date).slice(0,10);if(r.photo_path)a.ph=r.photo_path;return a;});
  (T.injuries||[]).forEach(function(r){var a=ath(r.athlete_id);if(a)a.inj=r.data;});
  db.records=(T.test_records||[]).map(mapRec);
  db.gps=(T.gps_sessions||[]).map(mapGps);
  db.surveys=(T.surveys||[]).map(mapSurvey);
  db.drills=(T.drills||[]).map(function(r){return Object.assign({id:r.id,d:r.d},r.data||{})});
  db.prog=mapProg(T.program_days,T.program_exercises);
  db.done=mapDone(T.exercise_done);
  db.perm=mapPerm(T.permissions);
  (T.settings||[]).forEach(function(r){db[r.key]=r.value;});
  db.v=6;
}
async function loadAll(){
  var T={},names=Object.keys(ORD);
  var res=await Promise.all(names.map(function(n){return fetchAll(n)}));
  names.forEach(function(n,i){T[n]=res[i];});
  applyRows(T);
  snapAll();
}
// Arka planda yeni anket, tamamlama ve GPS verisini çek (kaydedilmemiş değişiklik varsa dokunma)
async function softRefresh(){
  if(!SBC||!ROLE||SYNC.busy||SYNC.dirty||document.hidden)return;
  try{
    var names=ROLE==='coach'?['surveys','exercise_done','gps_sessions','test_records','permissions']:['surveys','exercise_done','program_days','program_exercises','permissions','test_records'];
    var res=await Promise.all(names.map(function(n){return fetchAll(n)}));
    if(SYNC.busy||SYNC.dirty)return;
    var T={};names.forEach(function(n,i){T[n]=res[i];});
    var sig=function(){return JSON.stringify([db.surveys,db.done,db.gps.length,db.records.length,db.athletes.map(function(a){return a.uid}),db.prog,db.perm]);};
    var before=sig();
    if(T.surveys)db.surveys=T.surveys.map(mapSurvey);
    if(T.exercise_done)db.done=mapDone(T.exercise_done);
    if(T.gps_sessions)db.gps=T.gps_sessions.map(mapGps);
    if(T.test_records)db.records=T.test_records.map(mapRec);
    if(T.program_days&&T.program_exercises)db.prog=mapProg(T.program_days,T.program_exercises);
    if(T.permissions)db.perm=mapPerm(T.permissions);
    if(ROLE==='coach'){await refreshAthleteMeta();SYNC.n=(SYNC.n||0)+1;if(SYNC.n%5===0)await refreshPhotos();}
    snapAll();
    if(before!==sig()){
      var t=document.activeElement&&document.activeElement.tagName;
      if(t!=='INPUT'&&t!=='SELECT'&&t!=='TEXTAREA')render();
    }
  }catch(e){}
}

function trErr(e){
  var m=(e&&e.message)||String(e);
  if(/Invalid login credentials/i.test(m))return 'E-posta veya şifre hatalı.';
  if(/already registered|already been registered/i.test(m))return 'Bu e-posta ile zaten kayıt var, giriş yapmayı dene.';
  if(/at least \d+ char|Password should be/i.test(m))return 'Şifre en az 8 karakter olmalı.';
  if(/Email not confirmed/i.test(m))return 'E-postanı onaylaman gerekiyor. Gelen kutunu kontrol et.';
  if(/valid email|invalid format|Unable to validate email/i.test(m))return 'Geçerli bir e-posta yaz.';
  if(/rate limit|too many/i.test(m))return 'Çok fazla deneme. Biraz bekleyip tekrar dene.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Bağlantı yok. İnternetini kontrol et.';
  if(/Could not find the function|PGRST202|set_my_photo/i.test(m))return 'Fotoğraf özelliği için veritabanı güncellemesi gerekiyor. Antrenörüne haber ver.';
  if(/row-level security/i.test(m))return 'Bu işlem için yetkin yok.';
  return m;
}

async function doSignIn(){
  var e=document.getElementById('au-e').value.trim(),p=document.getElementById('au-p').value;
  if(!e||!p){authMsg('E-posta ve şifre gerekli.');return;}
  busyBtn(true);authMsg('');
  var r=await SBC.auth.signInWithPassword({email:e,password:p});
  busyBtn(false);
  if(r.error){authMsg(trErr(r.error));return;}
  boot();
}
async function doSignUp(){
  var stm=authMode==='st',e=document.getElementById('au-e').value.trim(),p=document.getElementById('au-p').value,c=stm?'':document.getElementById('au-c').value.trim();
  if(!e||!p||(!stm&&!c)){authMsg(stm?'E-posta ve şifre gerekli.':'E-posta, şifre ve davet kodu gerekli.');return;}
  if(p.length<8){authMsg('Şifre en az 8 karakter olmalı.');return;}
  busyBtn(true);authMsg('');
  var r=await SBC.auth.signUp({email:e,password:p});
  busyBtn(false);
  if(r.error){authMsg(trErr(r.error));return;}
  try{if(stm)localStorage.removeItem('pp_pending_code');else localStorage.setItem('pp_pending_code',c);}catch(x){}
  if(!r.data||!r.data.session){authMsg('Kayıt alındı. E-postana gelen onay bağlantısına tıkla, sonra giriş yap.',true);return;}
  boot();
}
async function doClaim(){
  var c=(document.getElementById('au-c').value||'').trim();
  if(!c){authMsg('Kodu yaz.');return;}
  var r=await SBC.rpc('claim_athlete',{code:c});
  if(r.error){authMsg(trErr(r.error));return;}
  try{localStorage.removeItem('pp_pending_code');}catch(x){}
  boot();
}
async function doSignOut(){try{await SBC.auth.signOut();}catch(e){}location.reload();}

function setMyPhoto(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var i=new Image();
    i.onload=function(){
      var c=document.createElement('canvas');c.width=c.height=160;var m=Math.min(i.width,i.height);
      c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,160,160);
      savePhoto(c.toDataURL('image/jpeg',.8));
    };
    i.onerror=function(){toast('Bu dosya fotoğraf olarak açılamadı. Başka bir fotoğraf dene.');};
    i.src=r.result;
  };
  r.readAsDataURL(f);
}
async function savePhoto(url){
  var rr=await SBC.rpc('set_my_photo',{p:url});
  if(rr.error){toast(trErr(rr.error));return;}
  var a=ath(ME);if(a){if(url)a.ph=url;else delete a.ph;}
  snapAll();render();toast(url?'Fotoğraf kaydedildi':'Fotoğraf kaldırıldı');
}

  m=t.match(/^(\d{1,2})[-.\/](\d{1,2})[-.\/](\d{2,4})/);

}

async function txRead(inp){

function hiitShow(){return hiitPlan||today();}
function hiitCfg(){return Object.assign({method:'asr',pct:0.1,mpct:1,run:15,rest:15,setMin:4,sets:2,cone:5},db.hiit||{});}
function hiitMethod(v){var c=Object.assign({},hiitCfg());c.method=v==='mas'?'mas':'asr';db.hiit=c;save();render();}
function hiitSet(k,v){
  var n=parseFloat(String(v).replace(',','.'));if(!isFinite(n)||n<=0){toast('Sıfırdan büyük bir sayı yaz.');render();return;}
  var c=Object.assign({},hiitCfg());c[k]=(k==='pct'||k==='mpct')?n/100:n;db.hiit=c;save();render();
}
function pctl(a,p){var s=a.slice().sort(function(x,y){return x-y}),r=(s.length-1)*p,lo=Math.floor(r),hi=Math.ceil(r);return s[lo]+(s[hi]-s[lo])*(r-lo);}
function lastOn(aid,key,upTo){var b=null;db.records.forEach(function(r){if(r.a===aid&&r.d<=upTo&&r.v[key]!=null&&(!b||r.d>b.d))b={d:r.d,v:r.v[key]};});return b;}
function hiitRows(){
  var c=hiitCfg(),L=[];
  var byMas=c.method==='mas';
  db.athletes.forEach(function(a){var m=lastOn(a.id,'mas',hiitUp()),s=lastOn(a.id,'vmax',hiitUp());
    if(byMas){if(m)L.push({a:a,mss:s?s.v:null,mas:m.v,asr:s?s.v-m.v:null,md:m.d,sd:s?s.d:null});}
    else if(m&&s)L.push({a:a,mss:s.v,mas:m.v,asr:s.v-m.v,md:m.d,sd:s.d});});
  var as=L.map(function(x){return byMas?x.mas:x.asr}),p1=as.length>=3?pctl(as,1/3):null,p2=as.length>=3?pctl(as,2/3):null,reps=Math.floor(c.setMin*60/(c.run+c.rest));
  L.forEach(function(x){
    var gv=byMas?x.mas:x.asr;
    x.g=p1==null?0:gv<=p1?1:gv<=p2?2:3;
    x.tv=byMas?x.mas*c.mpct:x.mas+x.asr*c.pct;x.ms=x.tv/3.6;x.dist=x.ms*c.run;x.cone=Math.round(x.dist/c.cone)*c.cone;x.reps=reps;x.tot=x.dist*reps*c.sets;x.d10=x.ms*10;x.d15=x.ms*15;x.d20=x.ms*20;
  });
  return L.sort(function(x,y){return (x.g-y.g)||x.a.n.localeCompare(y.a.n,'tr');});
}
function hiitLine(c){return (c.method==='mas'?'MAS %'+Math.round(c.mpct*10000)/100:'ASR %'+Math.round(c.pct*10000)/100)+' · koşu '+c.run+' sn / dinlenme '+c.rest+' sn · set '+c.setMin+' dk × '+c.sets+' set · koni '+c.cone+' m';}
function hiitTable(L,rep){
  var f1=function(x){return x==null?'-':x.toFixed(1)},f0=function(x){return Math.round(x)};
  return '<table'+(rep?'':' class="tb" style="min-width:760px"')+'><thead><tr><th>Sporcu</th><th>Grup</th><th>MSS</th><th>MAS</th><th>MAS tarihi</th><th>ASR</th><th>Hedef hız</th><th>Mesafe (m)</th><th>Koni (m)</th><th>Tekrar</th><th>Toplam (m)</th><th>10 sn</th><th>15 sn</th><th>20 sn</th></tr></thead><tbody>'+L.map(function(x){
    return '<tr><td>'+esc(x.a.n)+'</td><td>'+esc(HGN(x.g).replace('Grup ',''))+'</td><td>'+f1(x.mss)+'</td><td>'+f1(x.mas)+'</td><td>'+trDate(x.md)+'</td><td>'+(x.asr==null?'-':x.asr.toFixed(2))+'</td><td>'+x.tv.toFixed(1)+'</td><td><b>'+x.dist.toFixed(1)+'</b></td><td><b>'+x.cone+'</b></td><td>'+x.reps+'</td><td>'+f0(x.tot)+'</td><td>'+f0(x.d10)+'</td><td>'+f0(x.d15)+'</td><td>'+f0(x.d20)+'</td></tr>';}).join('')+'</tbody></table>';
}
function hiitGroups(L){
  return [1,2,3].map(function(g){
    var q=L.filter(function(x){return x.g===g});if(!q.length)return '';
    var av=function(k){return q.reduce(function(s,x){return s+x[k]},0)/q.length};
    return '<div class="rank"><div class="top"><span><b>'+HGN(g)+'</b></span><span>'+q.length+' sporcu</span></div><p class="dim" style="margin:4px 0 0">'+(hiitMas()?'Ort. MAS '+av('mas').toFixed(1):'Ort. ASR '+av('asr').toFixed(2))+' · ort. hedef hız '+av('tv').toFixed(1)+' km/sa · ort. mesafe '+av('dist').toFixed(1)+' m</p></div>';}).join('');
}

function hiitSave(){
  var d=document.getElementById('hm-d').value;if(!d){toast('Test tarihini yaz.');return;}
  var n=0;
  db.athletes.forEach(function(a){
    var s=txNum(document.getElementById('hv-'+a.id).value),m=txNum(document.getElementById('ha-'+a.id).value);
    if(s==null&&m==null)return;
    var rec=db.records.filter(function(r){return r.a===a.id&&r.d===d})[0];
    if(!rec){rec={id:uid(),a:a.id,d:d,v:{}};db.records.push(rec);}
    if(s!=null)rec.v.vmax=s;if(m!=null)rec.v.mas=m;n++;
  });
  if(!n){toast('Değer girmedin.');return;}
  hiitEdit=false;save();render();toast(n+' sporcunun değeri '+trDate(d)+' tarihine kaydedildi.');
}

function vPool(){
  if(!STAFF){var _c1=poolSetup(),_c2=poolSeedAdd(),_c3=poolVidAdd();if(_c1||_c2||_c3)save();}
  var all=poolList(),h='<h1>GYM</h1><p class="sub">Tüm hareketlerin burada durur. Günlere buradan atanır. Sporcu burayı görmez, yalnızca senin atadıklarını görür.</p>';
  poolTypes().forEach(function(T){
    var L=all.filter(function(e){return (e.t||'Türsüz')===T;}),open=poolOpen===T;
    h+=poolHead(T,L.length,open,"poolTog('"+T.replace(/'/g,'')+"')");
    if(!open)return;
    h+='<div style="padding:4px 0 8px">';
    if(T==='Kuvvet'){
      h+='<div class="row" style="gap:6px;margin:8px 0"><button class="btn small'+(poolMode==='tip'?'':' ghost')+'" onclick="poolMd(\'tip\')">Hareket tipine göre</button><button class="btn small'+(poolMode==='kas'?'':' ghost')+'" onclick="poolMd(\'kas\')">Kas grubuna göre</button></div>';
      var keys=poolMode==='tip'?POOLS.Kuvvet:POOLM,fld=poolMode==='tip'?'s':'m';
      keys.concat(['']).forEach(function(k){
        var X=L.filter(function(e){return (e[fld]||'')===k;});if(!k&&!X.length)return;
        var lab=k||'Belirtilmemiş',op=poolSub===lab;
        h+=poolHead(lab,X.length,op,"poolSb('"+lab+"')",true);
        if(op)h+='<div class="list" style="margin-top:6px">'+(X.length?X.map(poolRow).join(''):'<div class="empty"><p>Henüz hareket yok.</p></div>')+'</div>';
      });
    }else if(POOLS[T]){
      POOLS[T].concat(['']).forEach(function(k){
        var X=L.filter(function(e){return (e.s||'')===k;});if(!k&&!X.length)return;
        var lab=k||'Belirtilmemiş',op=poolSub===lab;
        h+=poolHead(T==='Core'?('Core '+(k?k.toLowerCase():'(belirtilmemiş)')):lab,X.length,op,"poolSb('"+lab+"')",true);
        if(op)h+='<div class="list" style="margin-top:6px">'+(X.length?X.map(poolRow).join(''):'<div class="empty"><p>Henüz hareket yok.</p></div>')+'</div>';
      });
    }else{
      h+='<div class="list">'+(L.length?L.map(poolRow).join(''):'<div class="empty"><p>Henüz hareket yok.</p></div>')+'</div>';
    }
    if(poolForm&&(poolForm.id||poolForm.t===T))h+=poolFormH();
    else h+='<div class="row" style="margin-top:10px"><button class="btn ghost" onclick="poolAdd(\'\')">+ Hareket ekle</button></div>';
    h+='</div>';
  });
  return h;
}
function poolTog(t){poolOpen=poolOpen===t?'':t;poolSub='';poolForm=null;render();}

function poolSave(){
  var n=document.getElementById('pl-n').value.trim(),u=document.getElementById('pl-u').value.trim();
  if(!n){toast('Hareket adı gerekli.');return;}
  if(u&&!u.split('|').every(function(x){return /^https?:\/\//i.test(x.trim());})){toast('Bağlantı https:// ile başlamalı.');return;}
  var t=document.getElementById('pl-c').value,b=document.getElementById('pl-b'),L=poolList(),o={n:n,t:t,s:b?b.value:'',m:document.getElementById('pl-m').value,sets:document.getElementById('pl-s').value.trim(),reps:document.getElementById('pl-r').value.trim(),url:u,note:document.getElementById('pl-t').value.trim()};
  var id=poolForm&&poolForm.id;
  if(id){L.forEach(function(e){if(e.id===id)Object.assign(e,o);});}
  else{o.id=uid();L.push(o);}
  poolOpen=t;poolSub=t==='Kuvvet'?(poolMode==='tip'?(o.s||'Belirtilmemiş'):(o.m||'Belirtilmemiş')):(POOLS[t]?(o.s||'Belirtilmemiş'):'');
  poolForm=null;save();render();toast(id?'Hareket güncellendi':'Havuza eklendi');
}

function annPick(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){
    var k=Math.min(1,900/Math.max(im.width,im.height)),u='';
    for(var i=0;i<6&&!u;i++){
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      var qs=[0.8,0.65,0.5,0.4];for(var j=0;j<qs.length;j++){var t=c.toDataURL('image/jpeg',qs[j]);if(t.length<=150000){u=t;break;}}
      k*=0.8;
    }
    if(!u){toast('Fotoğraf çok büyük, başka bir fotoğraf dene.');return;}
    annDraft.img=u;render();
  };im.onerror=function(){toast('Fotoğraf okunamadı.');};im.src=rd.result;};
  rd.readAsDataURL(f);
}

function histTable(a,max,rep,filt){
  if(!rep){
    var bd={};db.records.filter(function(r){return r.a===a.id}).forEach(function(r){bd[r.d]=Object.assign(bd[r.d]||{},derive(r.v));});
    series(a.id,'asr').forEach(function(p){if(bd[p.d])bd[p.d].asr=p.v;});
    var dd=Object.keys(bd).sort().reverse().slice(0,max);if(!dd.length)return '';
    var cols=[];T.forEach(function(g){g.m.forEach(function(k){if(cols.indexOf(k)<0&&!(filt&&hideK(k))&&dd.some(function(d){return bd[d][k]!=null}))cols.push(k);});});
    if(!cols.length)return '';
    var th='<tr><th style="position:sticky;left:0;background:var(--bg);z-index:1">Tarih</th>'+cols.map(function(k){return '<th style="white-space:nowrap">'+M[k][0]+(M[k][1]?'<br><span class="dim">'+M[k][1]+'</span>':'')+'</th>'}).join('')+'</tr>';
    var tr=dd.map(function(d){return '<tr><td style="position:sticky;left:0;background:var(--bg);white-space:nowrap">'+trDate(d)+'</td>'+cols.map(function(k){return '<td>'+(bd[d][k]!=null?fmt(k,bd[d][k]):'-')+'</td>'}).join('')+'</tr>'}).join('');
    return '<h3 class="ct" style="margin-top:18px">Test geçmişi</h3><div class="tw"><table class="tb" style="min-width:'+(110+cols.length*84)+'px"><thead>'+th+'</thead><tbody>'+tr+'</tbody></table></div><p class="dim" style="margin:4px 0 0">Her satır bir test günü, en yenisi üstte. Yeni veri girdikçe satır eklenir, eskiler silinmez. Tabloyu sağa kaydırarak tüm testleri görebilirsin.</p>';
  }
  var by={};db.records.filter(function(r){return r.a===a.id}).forEach(function(r){by[r.d]=Object.assign(by[r.d]||{},derive(r.v));});
  series(a.id,'asr').forEach(function(p){if(by[p.d])by[p.d].asr=p.v;});
  var ds=Object.keys(by).sort().slice(-max);if(!ds.length)return '';

  return rep?'<h2>Test geçmişi (tarihe göre)</h2>'+tb:'<h3 class="ct" style="margin-top:18px">Test geçmişi</h3><div class="tw">'+tb+'</div><p class="dim" style="margin:4px 0 0">Her test kendi tarihinde saklanır, yeni test eski testin üzerine yazılmaz.</p>';
}

function seedMatches(){

function mStat(a){
  var t={m:0,s:0,min:0,g:0,a:0,y:0},rows=[],tk=nTok(a.n);
  (db.matches||[]).slice().sort(function(x,y){return x.d<y.d?-1:1}).forEach(function(m){
    var pi=-1;
    (m.pl||[]).some(function(p,i){if(nMatch(tk,nTok(p.n))){pi=i;return true}return false});
    var p=pi>-1?m.pl[pi]:null;
    rows.push({m:m,pi:pi,p:p});
    if(!p)return;
    t.m++;if(p.s)t.s++;t.min+=Math.max(0,(p.o||0)-(p.i||0));t.g+=p.g||0;t.a+=p.a||0;t.y+=p.y||0;
  });
  return {t:t,rows:rows};

// ---- PDF sayfalama: tek sayfaya sığabiliyorsa sığdır, satırları ortadan kesme
function pdfPlan(H,pageH,bk){
  bk=(bk||[]).filter(function(b){return b>0&&b<H}).sort(function(a,b){return a-b});
  function cut(f){
    var ph2=pageH/f,pages=[],y=0;
    while(y<H-1){
      var lim=y+ph2;
      if(lim>=H-1){pages.push({y:y,h:H-y});break;}
      var c=lim;
      for(var i=bk.length-1;i>=0;i--){if(bk[i]<=lim&&bk[i]>y+ph2*0.4){c=bk[i];break;}}
      pages.push({y:y,h:c-y});y=c;
    }
    return pages;
  }
  var n=Math.max(1,Math.ceil(H/pageH-1e-6)),f=1,pages=cut(1);
  // taşma küçükse (en fazla %20) bir sayfa eksiğe sığacak kadar küçült
  if(n>1&&H<=(n-1)*pageH*1.2){
    for(var k=0.97;k>=0.8;k-=0.02){
      var q=cut(k*Math.min(1,(n-1)*pageH/H));
      if(q.length<=n-1){f=k*Math.min(1,(n-1)*pageH/H);pages=q;break;}
    }
  }
  return {f:f,pages:pages};
}

function guMatch(name){
  var tk=nTok(name);if(!tk.length)return {t:'none'};
  var l=db.athletes.filter(function(a){return nMatch(tk,nTok(a.n));});
  if(l.length===1)return {t:'ok',a:l[0]};
  if(l.length>1){var ex=l.filter(function(a){return nTok(a.n).join(' ')===tk.join(' ');});if(ex.length===1)return {t:'ok',a:ex[0]};return {t:'amb'};}
  return {t:'none'};
}
function guPrev(){
  var mp=gu.map,ok=[],un={},amb={},bad=0,over=0,have={};
  db.gps.forEach(function(g){have[g.a+'|'+g.d]=1;});
  gu.rows.slice(1).forEach(function(r){
    var nm=mp.ath>=0?String(r[mp.ath]||'').trim():'',d=mp.date>=0?pDate(r[mp.date]):gu.fdate;

    else if(x.t==='amb')amb[nm]=1;else un[nm]=1;

}

async function guRead(inp){
  var f=inp.files[0];if(!f)return;
  var nm=f.name.toLowerCase(),rows;

    if(/\.(xlsx|xlsm|xls)$/.test(nm)){
      if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');

    }else rows=parseCSV((await f.text()).replace(/^﻿/,''));
  }catch(e){toast('Dosya okunamadı. .csv ya da .xlsx dene.');return;}
  rows=rows.map(function(r){return r.map(function(c){return String(c==null?'':c);});}).filter(function(r){return r.some(function(c){return c.trim()!=='';});});
  if(rows.length<2){toast('Dosyada veri satırı bulunamadı.');return;}

// ---- Geri tuşu ve telefonun geri hareketi
var NAVS=[],NAVIN=0,NAVH=true;
function navSnap(){return {v:view,a:selA,m:meSec,g:gpsMode,l:loadMode,x:typeof mxMode!=='undefined'?mxMode:null};}
function navSame(a,b){return a.v===b.v&&a.a===b.a&&a.m===b.m&&a.g===b.g&&a.l===b.l&&a.x===b.x;}
function navPush(p){
  NAVS.push(p);if(NAVS.length>40)NAVS.shift();
  if(NAVH){try{history.pushState({pp:NAVS.length},'');}catch(e){NAVH=false;}}
}
function navHome(){return ROLE==='athlete'?meSec==='home':view==='home';}
function navApply(s){
  NAVIN++;
  try{view=s.v;selA=s.a;meSec=s.m;gpsMode=s.g;loadMode=s.l;if(s.x!==null&&typeof mxMode!=='undefined')mxMode=s.x;render();window.scrollTo(0,0);}
  finally{NAVIN--;}
}
function navBack(){
  var s=NAVS.pop();
  if(s){navApply(s);return;}
  if(!navHome()){NAVIN++;try{if(ROLE==='athlete')meSec='home';else view='home';render();window.scrollTo(0,0);}finally{NAVIN--;}}
}
function navClick(){
  if(NAVH&&NAVS.length){try{history.back();return;}catch(e){NAVH=false;}}
  navBack();
}
window.addEventListener('popstate',function(){if(NAVS.length)navBack();});
var _goNav=go;
go=function(){
  var p=navSnap(),r=_goNav.apply(this,arguments);
  if(!NAVIN){var c=navSnap();if(!navSame(p,c))navPush(p);}
  return r;
};
var _mgNav=mnGo;
mnGo=function(){
  var p=navSnap();NAVIN++;
  try{var r=_mgNav.apply(this,arguments);}finally{NAVIN--;}
  if(!NAVIN){var c=navSnap();if(!navSame(p,c))navPush(p);}
  return r;
};

var _mnbBk=mnBuild;
mnBuild=function(){
  _mnbBk.apply(this,arguments);
  var bar=document.getElementById('mnbar');
  if(bar){
    var b=document.getElementById('bkbtn');
    if(!b){b=document.createElement('button');b.id='bkbtn';b.type='button';b.setAttribute('aria-label','Geri');b.innerHTML='<b aria-hidden="true">‹</b>Geri';b.onclick=navClick;var t=document.getElementById('mnttl');if(t&&t.parentNode===bar)bar.insertBefore(b,t);else bar.appendChild(b);}
    b.classList.toggle('on',!navHome());
  }
};



// ---- Sporcu kutucukları (ana ekran): forma numarası, soyadı, durum rengi
SETK.push('jersey');
var JERED=false;
var PSTAT={m:['Müdahale','#e5484d',0],i:['İzle','#f5a524',1],s:['Sakat','#6e8bb8',2],h:['Hazır','#30a46c',3]};
function pStat(a){
  if(isInj(a))return 's';
  var td=today(),lim=dnum(td)-2,hiP=false,anyP=false;
  SV().forEach(function(x){if(x.a!==a.id||dnum(x.d)<lim)return;(x.pain||[]).forEach(function(p){anyP=true;if(p.v>=7)hiP=true;});});
  var e=null;try{e=ewma(a.id,'td');}catch(er){}
  var hiL=!!(e&&e.r!=null&&e.n>=28&&e.r>1.5);
  if(hiP||(hiL&&anyP))return 'm';
  if(hiL||anyP)return 'i';
  return 'h';
}
function pSur(a){var p=String(a.n||'').trim().split(/\s+/);return (p.length>1?p[p.length-1]:p[0]||'').toLocaleUpperCase('tr');}
function pIni(a){var p=String(a.n||'').trim().split(/\s+/);return ((p[0]||'').charAt(0)+(p.length>1?p[p.length-1].charAt(0):'')).toLocaleUpperCase('tr');}
function jerSet(id,v){var d=String(v||'').replace(/\D/g,'').slice(0,2);if(!db.jersey||typeof db.jersey!=='object')db.jersey={};if(d)db.jersey[id]=d;else delete db.jersey[id];save();}
function pAssign(act){
  if(STAFF)return;
  if(!db.jersey||typeof db.jersey!=='object')db.jersey={};
  var J=db.jersey,used={},ch=false;
  Object.keys(J).forEach(function(k){used[J[k]]=1;});
  var miss=act.filter(function(a){return !J[a.id];}).sort(function(x,y){return pSur(x).localeCompare(pSur(y),'tr');});
  var gk=[30,40,50],g=0,n=1;
  miss.forEach(function(a){
    var v;
    if(a.p==='Kaleci'){while(g<gk.length&&used[String(gk[g])])g++;v=g<gk.length?String(gk[g]):null;if(v===null){n=Math.max(n,60);}}
    if(!v){while(used[String(n)])n++;v=String(n);}
    J[a.id]=v;used[v]=1;ch=true;
  });
  if(ch)save();
}
function pTiles(){
  var act=db.athletes.filter(function(a){return !a.arch;});if(!act.length)return '';
  pAssign(act);
  var J=db.jersey||{},L=act.map(function(a){return {a:a,s:pStat(a)};});
  var cnt={m:0,i:0,s:0,h:0};L.forEach(function(x){cnt[x.s]++;});
  L.sort(function(x,y){var nx=parseInt(J[x.a.id],10),ny=parseInt(J[y.a.id],10);return (isNaN(nx)?999:nx)-(isNaN(ny)?999:ny)||pSur(x.a).localeCompare(pSur(y.a),'tr');});
  var h='<div class="grp" style="margin-top:18px"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Sporcular</h2>'+(STAFF?'':'<button class="btn small ghost" onclick="JERED=!JERED;render()">'+(JERED?'Bitti':'GPS numaraları')+'</button>')+'</div>';
  h+='<div class="row" style="gap:6px;flex-wrap:wrap;margin:10px 0">'+['m','i','h','s'].map(function(k){return '<span class="pst" style="--st:'+PSTAT[k][1]+'"><i></i><b>'+cnt[k]+'</b> '+PSTAT[k][0]+'</span>';}).join('')+'</div>';
  if(JERED&&!STAFF){
    h+='<div class="list">'+L.slice().sort(function(x,y){return pSur(x.a).localeCompare(pSur(y.a),'tr');}).map(function(x){return '<div class="rank"><div class="top"><span>'+esc(x.a.n)+'</span><input inputmode="numeric" aria-label="GPS numarası" style="width:72px;text-align:center" maxlength="2" value="'+esc(J[x.a.id]||'')+'" onchange="jerSet(\''+x.a.id+'\',this.value)"></div></div>';}).join('')+'</div>';
  }else{
    h+='<div class="ptiles">'+L.map(function(x){var no=J[x.a.id];return '<button type="button" class="ptile" style="--st:'+PSTAT[x.s][1]+'" aria-label="'+esc(x.a.n)+', '+PSTAT[x.s][0]+'" onclick="go(\'profile\',\''+x.a.id+'\')"><b class="pt-no">'+esc(no||pIni(x.a))+'</b><span class="pt-nm">'+esc(pSur(x.a))+'</span></button>';}).join('')+'</div>';
    h+='<p class="dim" style="margin:10px 0 0;font-size:12px">Müdahale: yüksek şiddetli ağrı, ya da yüksek yük ve ağrı birlikte. İzle: tek sinyal (son 3 günde ağrı bildirimi veya ACWR 1,5 üstü). Sakat: aktif sakatlık.</p>';
  }
  return h+'</div>';
}
(function(){var st=document.createElement('style');st.textContent='.ptiles{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}@media(min-width:700px){.ptiles{grid-template-columns:repeat(10,1fr)}}.ptile{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--bg));color:var(--ink);border-radius:9px;padding:7px 2px 6px;text-align:center;font:inherit;min-height:58px;cursor:pointer}.ptile::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--st)}.hsm{grid-template-columns:repeat(3,1fr)!important}.hsm .pt-no{font-size:20px}.hsm .pt-nm{font-size:9px}.pt-no{display:block;font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.02em}.pt-nm{display:block;font-size:8px;letter-spacing:.03em;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}.pst{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px}.pst i{width:10px;height:10px;border-radius:50%;background:var(--st);display:inline-block}';st.textContent+=['jerSet('].map(function(h){return 'body.ro [onclick*="'+h+'"],body.ro [onchange*="'+h+'"]';}).join(',')+'{display:none!important}';document.head.appendChild(st);})();
var _vhPt=vHome;
vHome=function(){
  var h=_vhPt(),k='<p class="dim">Sol üstteki üç çizgi';
  try{var t=pTiles();if(t){var m=h.match(/<div class="ptiles hsm">[\s\S]*?<\/div>/),sm='';if(m){sm=m[0];h=h.replace(sm,'');}var i=h.indexOf(k);t+=sm?'<div style="height:8px"></div>'+sm:'';return i>-1?h.slice(0,i)+t+h.slice(i):h+t;}}catch(e){}
  return h;
};
// ---- Yumuşak sayfa geçişleri
(function(){
  var st=document.createElement('style');
  st.textContent='#mndr{transition:transform .72s cubic-bezier(.2,.7,.2,1)!important}#mnov.on{animation:ppfade .65s ease both}@keyframes ppfade{from{opacity:0}to{opacity:1}}'
   +'.btn,.hcard,.rank,.chip{transition:transform .12s ease,background-color .18s ease,border-color .18s ease,opacity .18s ease}.btn:active,.hcard:active{transform:scale(.97)}'
   +'@media(prefers-reduced-motion:reduce){#mndr{transition:none!important}#mnov.on{animation:none}.btn,.hcard,.rank,.chip{transition:none}.btn:active,.hcard:active{transform:none}}';
  document.head.appendChild(st);
})();
var _rdAn=render,_anKey='';
function anKey(){try{return ROLE==='athlete'?('a:'+meSec):('c:'+view+':'+(selA||'')+':'+loadMode+':'+gpsMode);}catch(e){return '';}}
render=function(){
  var k=anKey(),chg=k!==_anKey&&_anKey!=='';_anKey=k;
  var back=typeof NAVIN!=='undefined'&&NAVIN>0;
  _rdAn.apply(this,arguments);
  if(!chg)return;
  try{
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var app=document.getElementById('app');if(!app||!app.children||!app.children[0]||!app.children[0].animate)return;
    var kids=app.children,n=Math.min(kids.length,14),dx=back?-18:18;
    for(var i=0;i<n;i++){
      kids[i].animate([{opacity:0,transform:'translate('+dx+'px,6px)'},{opacity:1,transform:'none'}],{duration:1000,delay:Math.min(i*85,680),easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'});
    }
  }catch(e){}
};
// ---- Uygulama olarak yükleme (PWA)
var DEFERRED=null;
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();DEFERRED=e;});
window.addEventListener('appinstalled',function(){DEFERRED=null;toast('Uygulama yüklendi');});
async function installApp(){
  if(DEFERRED){DEFERRED.prompt();try{await DEFERRED.userChoice;}catch(e){}DEFERRED=null;return;}
  var el=document.getElementById('inst');
  if(!el){el=document.createElement('div');el.id='inst';document.body.appendChild(el);}
  var steps=isIOS()
    ?'<li>Bu sayfayı Safari\'de aç (başka tarayıcıda olmaz).</li><li>Altta Paylaş simgesine (kare ve yukarı ok) dokun.</li><li>"Ana Ekrana Ekle"yi seç, sonra Ekle de.</li>'
    :'<li>Tarayıcı menüsünü aç (sağ üstte üç nokta).</li><li>"Uygulamayı yükle" ya da "Ana ekrana ekle"yi seç.</li><li>Yükle de.</li>';
  el.innerHTML='<div class="instc"><b>Uygulama olarak kur</b><ol>'+steps+'</ol><p class="dim" style="margin:0 0 14px">Kurduktan sonra ana ekrandaki simgeden açılır, tarayıcı çubuğu görünmez.</p><button class="btn" onclick="document.getElementById(\'inst\').style.display=\'none\'">Tamam</button></div>';
  el.style.display='flex';
}

boot();
